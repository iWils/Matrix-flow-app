# Matrix Flow - Application de gestion de matrices de flux réseau
# Architecture: Application Next.js monolithique avec PostgreSQL

services:
  # Base de données PostgreSQL
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-matrixflow}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      # Configuration PostgreSQL optimisée
      - ./config/postgres.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 3
    # Optimisations mémoire
    shm_size: 256m

  # Application Next.js (Frontend + Backend API)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Base de données
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@${POSTGRES_IP:-db}:5432/${POSTGRES_DB:-matrixflow}
      # URLs (automatiquement HTTPS si ENABLE_HTTPS=true)
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-nextauth-secret}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-${NEXTAUTH_URL:-http://localhost:3000}}
      - AUTH_TRUST_HOST=true
      - NODE_ENV=${NODE_ENV:-production}
      # Redis cache (optionnel)
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # HTTPS désactivé pour simplification
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-3000}:3000"    # Port HTTP uniquement
    volumes:
      - /srv/backups:/backups
    # Configuration production avec healthcheck
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Cache Redis (Phase 2 - Optionnel)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 3

volumes:
  dbdata:
  redisdata: