# Configuration PostgreSQL optimisée pour le développement Matrix Flow
# Ces paramètres privilégient la vitesse sur la durabilité pour les environnements de dev

# Paramètres de mémoire optimisés
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 4MB
maintenance_work_mem = 64MB

# Optimisations pour la vitesse (développement seulement)
fsync = off                          # Dangeureux en production !
synchronous_commit = off             # Dangeureux en production !
full_page_writes = off              # Dangeureux en production !
checkpoint_completion_target = 0.9
wal_buffers = 16MB
checkpoint_segments = 32

# Optimisations des connexions
max_connections = 100
shared_preload_libraries = ''

# Logging pour le debug
log_statement = 'mod'
log_min_duration_statement = 1000
log_line_prefix = '%t [%p]: '

# Autovacuum optimisé
autovacuum = on
autovacuum_max_workers = 3